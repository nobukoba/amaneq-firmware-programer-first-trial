name: Build macOS desktop app
on:
  workflow_dispatch:
  push:
    paths:
      - '*app.py'
      - 'windows_usb.py'
      - 'desktop_services.py'
      - 'network_*.py'
      - 'build-network-tools.py'
      - 'vendor/**'
      - 'macos_network.py'
      - 'test_desktop_services.py'
      - 'amaneq-firmware-programer.py'
      - 'build-macos-app.py'
      - '.github/workflows/macos-app.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python-architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Install build dependencies
        run: |
          brew install openfpgaloader
          python -m pip install pyinstaller==6.22.3 certifi
      - name: Offline tests
        run: python -m unittest test_amaneq_firmware_programer test_windows_usb test_macos_app test_desktop_services test_network_operations -v
      - name: Build and smoke-test app with bundled loader
        run: python build-macos-app.py
      - uses: actions/upload-artifact@v4
        with:
          name: amaneq-firmware-programer-macos-${{ matrix.architecture }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amaneq-firmware-programer-macos-*
          path: archives
      - name: Publish tested application downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="macos-preview-v0.3.0-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$REPOSITORY" --clobber archives/*/*.zip archives/*/*.sha256
          else
            gh release create "$tag" --repo "$REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "macOS desktop preview 0.3.0" --notes "macOS 15+. Board selection and Firmware, CDCE62002, MPC/MPCX/IP tabs. Automatic cable scan and latest firmware list. AMANEQ/CIRASAME firmware; STAG maps pending. Selectable Ethernet and temporary host 192.168.10.20/24; MPCX .10, MPC .16 or custom. Bundled pinned SiTCP commands with verification. Includes Python/Tk/openFPGALoader and CA certificates. Ad-hoc signed, not notarized. Physical HS3, clock/license writes and user-adapter IP changes remain unverified; network lifecycle is mock-tested." archives/*/*.zip archives/*/*.sha256
          fi
