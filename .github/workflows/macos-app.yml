name: Build macOS desktop app
on:
  workflow_dispatch:
  push:
    paths:
      - '*app.py'
      - 'windows_usb.py'
      - 'desktop_services.py'
      - 'network_*.py'
      - 'build-network-tools.py'
      - 'vendor/**'
      - 'macos_network.py'
      - 'test_desktop_services.py'
      - 'amaneq-firmware-programer.py'
      - 'build-macos-app.py'
      - '.github/workflows/macos-app.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python-architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Install build dependencies
        run: |
          brew install openfpgaloader
          python -m pip install pyinstaller==6.22.3 certifi
      - name: Offline tests
        run: python -m unittest test_amaneq_firmware_programer test_windows_usb test_macos_app test_desktop_services test_network_operations -v
      - name: Build and smoke-test app with bundled loader
        run: python build-macos-app.py
      - uses: actions/upload-artifact@v4
        with:
          name: amaneq-firmware-programer-macos-${{ matrix.architecture }}
          path: |
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amaneq-firmware-programer-macos-*
          path: archives
      - name: Publish tested application downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="macos-preview-v0.14.6-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$REPOSITORY" --clobber archives/*/*.zip archives/*/*.sha256
          else
            gh release create "$tag" --repo "$REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "macOS desktop preview 0.14.6" --notes "macOS 15+. Image source first; GitHub-only Target/Firmware/Format filters; local files retain explicit Target and detect content format. Editable MPC/MPCX paths with content detection; explicit visible mouse drag bar above Messages. Inline Cable (automatically detected), serial selector and Rescan. Fix BIT extension being misread as version component B; compact NIC/Host IP/Mask row. Firmware labels LR-TDC, HR-TDC, LR-TDC 10GbE, MIKUMARI Hub and Skelton. Target IP presets labeled SiTCP default / SiTCP-XG default. Clear CDCE62002 frequency label without HUL implementation jargon. Resizable window/UI scale, draggable Messages pane without Expand/Restore, log history without forced autoscroll, and tab-change canvas redraw. Inline frequency selector and normal-size bold Program image, Write MPC/MPCX, Write IP and Apply buttons. Single-row New device IP, one-line temporary static host IP label with DHCP preservation and exit restoration; remove prose below Write IP. Format labels MCS / BIT for all supported firmware families, fixed HR-TDC mezzanine firmware, single-line file paths that scroll to follow the caret. GUI firmware history from tags and firmware-directory commits; adjustable History limit (default 10), exact-commit downloads and revision labels. Tabs: Firmware, Jitter Cleaner, MPC/MPCX, IP. Correct MPC/MPCX labels verified against official synthetic fixtures. One-line Target IP with asynchronous Ping. Separate IP-only reader/writer; opt-in temporary host settings. Bundled Python/Tk/openFPGALoader and four pinned SiTCP helpers. Ad-hoc signed, not notarized. STAG firmware/clock maps pending; new GUI hardware operations remain physically unverified." archives/*/*.zip archives/*/*.sha256
          fi
