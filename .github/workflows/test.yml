name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest test_amaneq_firmware_programer -v
      - run: python -m compileall -q amaneq-firmware-programer.py test_amaneq_firmware_programer.py
      - name: Check Windows WSL setup without host changes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test-windows-wsl-setup.ps1
